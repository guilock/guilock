<g transform="translate(728 112)" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-13" y="-8" width="26" height="16" rx="2.5" fill="#0D1117"/>
  <path d="M-18 12 H18 L15 8 H-15 Z" fill="#0D1117"/>
</g>
<path class="wave" style="animation-delay:0.0s" d="M723.8 93.8 A6 6 0 0 1 732.2 93.8" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/><path class="wave" style="animation-delay:0.25s" d="M720.2 90.2 A11 11 0 0 1 735.8 90.2" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/><path class="wave" style="animation-delay:0.5s" d="M716.7 86.7 A16 16 0 0 1 739.3 86.7" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
<text x="728" y="144" class="mono lab" text-anchor="middle">LAPTOP (Wi-Fi)</text>

