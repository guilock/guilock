<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="GUILOCK - Networking, Linux, Security. Network topology with router, switch and devices" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#101813"/>
      <stop offset="1" stop-color="#163D25"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9FFD9"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.35" cy="0.5" r="0.75">
      <stop offset="0.5" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22C55E" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="300" rx="18"/></clipPath>

    <!-- simbolo generico de roteador: circulo com setas -->
    <g id="routerSym" stroke="#7CFF9B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle r="17" fill="#0D1117"/>
      <path d="M-11 0 H11 M0 -11 V11"/>
      <path d="M-11 0 l4 -3.5 M-11 0 l4 3.5 M11 0 l-4 -3.5 M11 0 l-4 3.5 M0 -11 l-3.5 4 M0 -11 l3.5 4 M0 11 l-3.5 -4 M0 11 l3.5 -4"/>
    </g>
  </defs>

  <style>
    .link { stroke: #22C55E; stroke-opacity: .55; stroke-width: 2; }
    .wlink { stroke: #38BDF8; stroke-opacity: .6; stroke-width: 1.8; stroke-dasharray: 5 6; animation: dash 2.5s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    .wave { animation: wave 1.8s ease-in-out infinite; opacity: .25; }
    @keyframes wave { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
    .lab { font-size: 10px; fill: #9FB3A5; letter-spacing: 1px; }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
    .ring2 { transform-box: fill-box; transform-origin: center; animation: spin 36s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sig { fill: none; stroke: #7CFF9B; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: sig 3.6s ease-out infinite; opacity: 0; }
    @keyframes sig { 0% { transform: scale(.55); opacity: .7; } 100% { transform: scale(1.5); opacity: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- aneis de cobertura ao redor da topologia -->
    <g fill="none" stroke="#22C55E" stroke-opacity=".12" stroke-dasharray="3 7">
      <circle cx="835" cy="158" r="95"/>
      <circle cx="835" cy="158" r="150"/>
      <circle cx="835" cy="158" r="210"/>
    </g>

    <rect width="1000" height="300" fill="url(#vignette)"/>

